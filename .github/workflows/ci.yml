name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Compile
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --all-targets

      - name: Generate ONNX seed
        run: cargo run --release --bin onnx-seed

      - name: Generate general graph seed
        run: cargo run --release --bin graph-seed

      - name: Smoke-test search
        run: >
          cargo run --release --bin neuro-search --
          --manifest seed/manifest.json
          --dataset seed/dataset.json
          --candidates 8
          --epochs 2
          --min-width 4
          --max-width 20
          --min-depth 1
          --max-depth 3
          --guided-fraction 0.75
          --guided-mutations 3
          --similarity-threshold 0.85
          --behavior-samples 128
          --behavior-candidates 8
          --behavior-correlation-threshold 0.90
          --behavior-merge-tolerance 0.01
          --validation-fraction 0.15
          --holdout-fraction 0.15
          --split-seed 42
          --export-best-dir grafted


      - name: Smoke-test graph search
        run: >
          cargo run --release --bin graph-search --
          --graph seed/graph.json
          --dataset seed/graph-dataset.json
          --candidates 8
          --mutations 3
          --epochs 3
          --learning-rate 0.01
          --accuracy-tolerance 0.05
          --validation-fraction 0.15
          --holdout-fraction 0.15
          --split-seed 42
          --export-best seed/grafted-graph.json
          --output graph-results.json
